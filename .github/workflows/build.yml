name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Restore dependencies
        run: dotnet restore .\PopMark.sln

      - name: Build release
        run: dotnet build .\PopMark.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test .\PopMark.sln --configuration Release --no-build

      - name: Install frontend dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Type-check frontend
        working-directory: ui
        run: bun run typecheck

      - name: Test frontend
        working-directory: ui
        run: bun run test

      - name: Build frontend bundle
        working-directory: ui
        run: bun run build
